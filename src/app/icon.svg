<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer Glow & Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Monogram Main Gradient -->
    <linearGradient id="monoGrad" x1="100" y1="120" x2="420" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="118" stroke="url(#borderGrad)" stroke-width="10" stroke-opacity="0.8"/>

  <!-- Subtle Interior Tech Grid Accent -->
  <circle cx="256" cy="256" r="180" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2"/>

  <!-- Monogram NA -->
  <g filter="url(#glow)">
    <!-- Letter N -->
    <path d="M 136 352 V 160 L 240 324 V 160" stroke="url(#monoGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter A -->
    <path d="M 284 352 L 348 160 L 412 352" stroke="url(#monoGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 314 276 H 382" stroke="url(#monoGrad)" stroke-width="30" stroke-linecap="round"/>
    
    <!-- AI Glowing Node Accent -->
    <circle cx="412" cy="154" r="18" fill="#38bdf8"/>
  </g>
</svg>
